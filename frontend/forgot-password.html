<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AI Research Paper Analyzer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Nav -->
  <nav class="navbar navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-cpu-fill text-primary fs-4"></i>
        <span>PaperAnalyzer</span>.ai
      </a>
      <button class="btn btn-outline-custom theme-toggle-btn px-3" type="button"><i class="bi bi-sun-fill"></i></button>
    </div>
  </nav>

  <!-- Main Reset Card -->
  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="custom-card p-4 p-sm-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold mb-1">Reset Password</h3>
            <p class="text-muted small">Enter your email address to receive a recovery link</p>
          </div>

          <div id="resetAlert" class="alert d-none" role="alert"></div>

          <form id="forgotForm">
            <div class="mb-4">
              <label for="resetEmail" class="form-label text-muted small fw-medium">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0 ps-0" id="resetEmail" placeholder="name@university.edu" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
              Send Reset Link
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
            <a href="login.html" class="small text-primary text-decoration-none fw-semibold">
              <i class="bi bi-arrow-left me-1"></i> Back to Log In
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('resetAlert');
      alertEl.className = 'alert alert-success d-block';
      alertEl.textContent = 'A reset link has been sent to your email address!';
    });
  </script>
</body>
</html>
